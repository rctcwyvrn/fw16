[package]
name = "omni"
description = "Host library for the omnimeter card: transports (mock, vfio, later sim), registers, test patterns"
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
bindgen = "0.72"

[dependencies]
libc = "0.2.191"
# No default features: those pull in kvm-ioctls, for registering the group
# with a hypervisor. omni drives the device itself; there is no VM.
vfio-ioctls = { version = "0.10", default-features = false }
vfio-bindings = "0.7"
vmm-sys-util = "0.15.0"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# Candidate A — 5 columns, mild column stagger, 3 thumb keys in a straight row.
# 18 keys per half, 36 total. Left half only; the template script mirrors it.
# Ergogen frame: mm, y up, columns left→right = outer→inner of the left hand.
meta:
  engine: 4.1.0
  name: A — 5 col, mild stagger, 3 thumbs straight
units:
  kx: 18    # Choc column pitch (hot-swap sockets need ≥ 18)
  ky: 17    # Choc row pitch
  capx: 17.5  # MBK / CFX Choc keycap
  capy: 16.5
  mcux: 22  # controller zone: XIAO / RP2040-Zero class + link jack
  mcuy: 40
  wall: 4   # case allowance beyond the key pitch box: 1 clearance + 3 wall
points:
  zones:
    matrix:
      key: {spread: kx, padding: ky, width: kx, height: ky}
      columns:
        pinky:
        ring: {key.stagger: 4}
        middle: {key.stagger: 2}
        index: {key.stagger: -2}
        inner: {key.stagger: -2}
      rows:
        bottom:
        home:
        top:
    thumb:
      anchor: {ref: matrix_inner_bottom, shift: [-1.5kx, -ky-2]}
      key: {spread: kx, padding: ky, width: kx, height: ky}
      columns:
        tuck:
        mid:
        reach:
      rows:
        cluster:
outlines:
  caps:
    - what: rectangle
      where: true
      size: [capx, capy]
  _pitch:
    - what: hull
      points:
        - matrix_pinky_bottom
        - matrix_pinky_top
        - matrix_ring_top
        - matrix_middle_top
        - matrix_index_top
        - matrix_inner_top
        - matrix_inner_bottom
        - thumb_reach_cluster
        - thumb_tuck_cluster
        - matrix_middle_bottom
        - matrix_ring_bottom
  mcu:
    - what: rectangle
      where: matrix_inner_top
      size: [mcux, mcuy]
      adjust: {shift: [kx/2 + mcux/2, ky/2 - mcuy/2]}
  # Ergogen 4.2.1 applies each step's `expand` to the union built so far, so _pitch gets 0
  # and the mcu step's `wall` expands both once (expanding _pitch too gave 8 mm, not 4).
  case:
    - what: outline
      name: _pitch
      expand: 0
    - what: outline
      name: mcu
      expand: wall
